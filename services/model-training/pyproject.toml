[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adguard-training"
version = "0.4.0"
description = "AdGuard M4 model engineering: dataset build, QLoRA SFT, DPO, distillation, gates"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Installed in the WSL2 CUDA environment (see scripts/setup_wsl_train.sh)
train = [
    "torch==2.5.1",
    "transformers==4.46.3",
    "peft==0.13.2",
    "trl==0.12.2",
    "datasets==3.1.0",
    "accelerate==1.1.1",
    "bitsandbytes==0.44.1",
    "sentencepiece",
    "protobuf",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
