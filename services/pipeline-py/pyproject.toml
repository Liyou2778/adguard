[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adguard-pipeline"
version = "0.3.0"
description = "AdGuard compliance pipeline: normalization, variant matching, clause retrieval and rule judging (P2 / M2-M3)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pypinyin>=0.53",
    "opencc-python-reimplemented>=0.1.7",
    "numpy>=2.0",
    "sqlite-vec>=0.1.6",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]
# Embeddings (M3). CPU wheels: pip install torch --index-url https://download.pytorch.org/whl/cpu
retrieval = ["torch>=2.5", "transformers>=4.46", "safetensors>=0.4"]
  # Multimodal parsing (M7 / FR-2): OCR + layout + landing-page extraction.
  parsing = ["rapidocr_onnxruntime>=1.4", "opencv-python-headless>=4.9", "pillow>=10",
             "beautifulsoup4>=4.12", "lxml>=5"]
  # Optional landing-page headless screenshot (system Edge/Chrome or bundled Chromium).
  render = ["playwright>=1.45"]
  # Optional video speech-to-text (CPU tiny model by default).
  asr = ["faster-whisper>=1.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
