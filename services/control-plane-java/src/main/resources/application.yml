server:
  port: ${CONTROL_PLANE_PORT:8081}

spring:
  application:
    name: adguard-control-plane
  datasource:
    url: ${CONTROL_PLANE_DB_URL:jdbc:mysql://127.0.0.1:3307/adguard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${CONTROL_PLANE_DB_USER:adguard}
    password: ${CONTROL_PLANE_DB_PASSWORD:adguard}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: adguard-cp-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.adguard.controlplane: INFO
adguard:
  auth:
    jwt-secret: ${ADGUARD_JWT_SECRET:}
    token-ttl-hours: ${ADGUARD_TOKEN_TTL_HOURS:12}
    admin-key: ${ADGUARD_ADMIN_KEY:}
    bootstrap-admin-username: ${ADGUARD_BOOTSTRAP_ADMIN_USERNAME:admin}
    bootstrap-admin-password: ${ADGUARD_BOOTSTRAP_ADMIN_PASSWORD:}
    required: ${ADGUARD_AUTH_REQUIRED:false}
  billing:
    # TTF/TTC path used for Chinese PDF bills; empty -> auto-detect common system fonts.
    pdf-font: ${ADGUARD_PDF_FONT:}
