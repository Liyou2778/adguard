server:
  port: ${CONTROL_PLANE_PORT:8081}

spring:
  application:
    name: adguard-control-plane
  datasource:
    url: ${CONTROL_PLANE_DB_URL:jdbc:mysql://127.0.0.1:3307/adguard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${CONTROL_PLANE_DB_USER:adguard}
    password: ${CONTROL_PLANE_DB_PASSWORD:adguard}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: adguard-cp-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.adguard.controlplane: INFO
