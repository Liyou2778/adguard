name: ci

on:
  push:
    branches: [ main ]
    paths:
      - 'adguard/**'
  pull_request:
    paths:
      - 'adguard/**'

defaults:
  run:
    working-directory: adguard

jobs:
  go-gateway:
    name: Go gateway (vet, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: adguard/services/gateway-go/go.sum
      - name: vet
        working-directory: adguard/services/gateway-go
        run: go vet ./...
      - name: test (race)
        working-directory: adguard/services/gateway-go
        run: go test -race ./...
      - name: build
        working-directory: adguard/services/gateway-go
        run: go build -o /tmp/gateway ./cmd/gateway

  java-control-plane:
    name: Java control plane (unit + Testcontainers IT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: verify
        working-directory: adguard/services/control-plane-java
        run: ./mvnw -B verify

  compose-config:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate
        working-directory: adguard
        run: docker compose -f deploy/docker-compose.yml config --quiet
